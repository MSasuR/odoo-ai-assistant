# Development overrides: mounts the code, enables auto-reload and uses the image with pytest/ruff.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  assistant:
    build:
      target: dev
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app/api
      - ./tests:/app/tests
      - ./evals:/app/evals
      - ./odoo_addon:/app/odoo_addon:ro
      - ./corpus:/app/corpus:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
