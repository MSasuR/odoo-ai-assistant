[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiom: dependencies are declared as argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-third-party = ["odoo"]

[tool.ruff.lint.per-file-ignores]
# Odoo modules import their submodules for side effects, and manifests are bare dict literals.
"odoo_addon/**/__init__.py" = ["F401"]
"odoo_addon/**/__manifest__.py" = ["B018", "UP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
